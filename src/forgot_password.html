<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — CutSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1117;
      --card: #1A1D29;
      --card3: #2A2F45;
      --border: rgba(255, 255, 255, .07);
      --border2: rgba(255, 255, 255, .13);
      --primary: #6366F1;
      --primary-d: #4F46E5;
      --primary-g: rgba(99, 102, 241, .14);
      --success: #22C55E;
      --success-g: rgba(34, 197, 94, .12);
      --danger: #EF4444;
      --danger-g: rgba(239, 68, 68, .12);
      --t1: #fff;
      --t2: #94A3B8;
      --t3: #475569;
      --radius: 8px;
      --radius-lg: 12px;
      --tr: .16s cubic-bezier(.4, 0, .2, 1);
      --font: 'Inter', system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      font-size: 15px
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    button {
      font-family: var(--font);
      cursor: pointer;
      border: none
    }

    input {
      font-family: var(--font);
      outline: none
    }

    .topbar {
      width: 100%;
      max-width: 1180px;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 32px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      color: var(--t1)
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px
    }

    .card {
      width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 30px 80px -25px rgba(0, 0, 0, .55)
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin-bottom: 6px
    }

    .sub {
      font-size: 13px;
      color: var(--t2);
      margin-bottom: 26px;
      line-height: 1.6
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--t2);
      margin-bottom: 6px;
      letter-spacing: .01em
    }

    .field {
      margin-bottom: 16px
    }

    input[type=email] {
      width: 100%;
      background: var(--card3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--t1);
      font-size: 13.5px;
      padding: 10px 12px;
      transition: var(--tr)
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-g)
    }

    .submit {
      width: 100%;
      padding: 11px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      transition: var(--tr);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .submit:hover:not(:disabled) {
      background: var(--primary-d);
      box-shadow: 0 0 20px rgba(99, 102, 241, .3)
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none
    }

    .submit.loading .spinner {
      display: inline-block
    }

    .submit.loading .btn-text {
      display: none
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .banner {
      font-size: 12.5px;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px
    }

    .banner.error {
      background: var(--danger-g);
      color: #FCA5A5;
      display: flex
    }

    .banner.success {
      background: var(--success-g);
      color: #86EFAC;
      display: flex
    }

    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 12.5px;
      color: var(--t2)
    }

    .foot a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600
    }

    .foot a:hover {
      text-decoration: underline
    }

    /* Success state */
    .success-state {
      display: none;
      text-align: center
    }

    .success-icon {
      width: 56px;
      height: 56px;
      background: var(--success-g);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px
    }

    .success-state h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px
    }

    .success-state p {
      font-size: 13px;
      color: var(--t2);
      line-height: 1.6;
      margin-bottom: 24px
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="logo" href="/welcome.html">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" width="16" height="16">
          <rect x="2" y="9.5" width="3" height="5" rx="1.5" fill="white" />
          <rect x="7" y="5.5" width="3" height="13" rx="1.5" fill="white" />
          <rect x="14" y="5.5" width="3" height="13" rx="1.5" fill="white" />
          <rect x="19" y="9.5" width="3" height="5" rx="1.5" fill="white" />
        </svg></div>
      CutSmart
    </a>
  </header>

  <div class="wrap">
    <div class="card">
      <!-- Forgot password form -->
      <div id="formState">
        <h1>Forgot password?</h1>
        <p class="sub">Enter your email and we'll send you a reset link. It expires in 1 hour.</p>

        <div class="banner error" id="errBanner"></div>

        <form id="forgotForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <button type="submit" class="submit" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-text">Send reset link</span>
          </button>
        </form>

        <div class="foot"><a href="/login">Back to login</a></div>
      </div>

      <!-- Success state -->
      <div class="success-state" id="successState">
        <div class="success-icon">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#22C55E"
              stroke-width="2" />
            <polyline points="22,6 12,13 2,6" stroke="#22C55E" stroke-width="2" />
          </svg>
        </div>
        <h2>Check your email</h2>
        <p>If that address is registered, a reset link is on its way. Check your inbox (and spam folder).</p>
        <a href="/login" class="submit" style="text-decoration:none">Back to login</a>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { showError('Enter your email address.'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.classList.add('loading');
      document.getElementById('errBanner').style.display = 'none';

      try {
        const r = await fetch(`${API}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        // Always show success — server never reveals if email exists
        document.getElementById('formState').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
      } catch {
        showError('Could not reach the server. Is it running?');
        btn.disabled = false; btn.classList.remove('loading');
      }
    });

    function showError(msg) {
      const b = document.getElementById('errBanner');
      b.textContent = msg; b.style.display = 'flex';
    }
  </script>
</body>

</html>
