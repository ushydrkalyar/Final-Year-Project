<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — CutSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/auth.css?v=20261123" />
  <style>
    .card {
      width: 380px;
    }
    .sub {
      line-height: 1.6;
    }
    .banner.success {
      background: var(--success-g);
      color: #86EFAC;
      display: flex;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      background: var(--success-g);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
  </style>
  <link rel="stylesheet" href="/assets/theme.css?v=20261123" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="topbar">
    <a class="logo" href="/welcome.html">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" width="16" height="16">
          <rect x="2" y="9.5" width="3" height="5" rx="1.5" fill="#0A0A0B" />
          <rect x="7" y="5.5" width="3" height="13" rx="1.5" fill="#0A0A0B" />
          <rect x="14" y="5.5" width="3" height="13" rx="1.5" fill="#0A0A0B" />
          <rect x="19" y="9.5" width="3" height="5" rx="1.5" fill="#0A0A0B" />
        </svg></div>
      CutSmart
    </a>
  </header>

  <div class="wrap">
    <div class="card">
      <!-- Forgot password form -->
      <div id="formState">
        <h1>Forgot password?</h1>
        <p class="sub">Enter your email and we'll send you a reset link. It expires in 1 hour.</p>

        <div class="banner error" id="errBanner"></div>

        <form id="forgotForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <button type="submit" class="submit" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-text">Send reset link</span>
          </button>
        </form>

        <div class="foot"><a href="/login">Back to login</a></div>
      </div>

      <!-- Success state -->
      <div class="success-state" id="successState">
        <div class="success-icon">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#34D399"
              stroke-width="2" />
            <polyline points="22,6 12,13 2,6" stroke="#34D399" stroke-width="2" />
          </svg>
        </div>
        <h2>Check your email</h2>
        <p>If that address is registered, a reset link is on its way. Check your inbox (and spam folder).</p>
        <a href="/login" class="submit" style="text-decoration:none">Back to login</a>
      </div>
    </div>
  </div>

  <script src="/assets/ui.js?v=20261123"></script>
  <script src="/assets/session.js?v=20261123"></script>
  <script src="/assets/api.js?v=20261123"></script>
  <script>

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { showError('Enter your email address.'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.classList.add('loading');
      document.getElementById('errBanner').style.display = 'none';

      try {
        await api('/auth/forgot-password', { json: { email }, redirect: false, fallback: 'Could not send a reset link. Try again shortly.' });
        // 200 whether or not the email exists: the server never reveals which
        document.getElementById('formState').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
      } catch (err) {
        showError(err.status === 422 ? 'Enter a valid email address.'
          : err.status ? 'Could not send a reset link. Try again shortly.' : err.message);
        btn.disabled = false; btn.classList.remove('loading');
      }
    });

    function showError(msg) {
      const b = document.getElementById('errBanner');
      b.textContent = msg; b.style.display = 'flex';
    }
  </script>
</body>

</html>
