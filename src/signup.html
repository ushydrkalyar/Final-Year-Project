<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — CutSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/auth.css?v=20261123" />
  <style>
    body {
      background-image: radial-gradient(circle at 50% 0%, rgba(116, 245, 184, .10), transparent 45%);
    }
    .logo {
      letter-spacing: -.01em;
    }
    .logo-icon svg {
      width: 16px;
      height: 16px;
      stroke: #fff;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
    }
    .card {
      width: 400px;
    }
    input.err {
      border-color: var(--danger);
    }
    #otpStep {
      display: none;
    }
    .otp-info {
      font-size: 13px;
      color: var(--t2);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .otp-info strong {
      color: var(--t1);
    }
    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .otp-inputs input {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      font-family: var(--mono);
      background: var(--card3);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--t1);
      caret-color: var(--primary);
    }
    .otp-inputs input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-g);
    }
    .resend-row {
      text-align: center;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--t2);
    }
    .resend-row button {
      background: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 12.5px;
      padding: 0;
      border: none;
      cursor: pointer;
    }
    .resend-row button:disabled {
      color: var(--t3);
      cursor: not-allowed;
    }
  </style>
  <link rel="stylesheet" href="/assets/theme.css?v=20261123" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="topbar">
    <a class="logo" href="/welcome.html">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="9.5" width="3" height="5" rx="1.5" fill="#0A0A0B" />
          <rect x="7" y="5.5" width="3" height="13" rx="1.5" fill="#0A0A0B" />
          <rect x="14" y="5.5" width="3" height="13" rx="1.5" fill="#0A0A0B" />
          <rect x="19" y="9.5" width="3" height="5" rx="1.5" fill="#0A0A0B" />
          <line x1="12" y1="6" x2="12" y2="18" stroke="#0A0A0B" stroke-width="1.5" stroke-linecap="round"
            stroke-dasharray="1.5 2.3" opacity=".85" />
        </svg></div>
      CutSmart
    </a>
  </header>

  <div class="wrap">
    <div class="card">

      <!-- Step 1: Signup form -->
      <div id="signupStep">
        <h1>Create your account</h1>
        <p class="sub">Free to start — no credit card needed.</p>

        <div class="banner error" id="errBanner"></div>

        <!-- Google Sign-Up -->
        <a class="google-btn" href="/auth/google">
          <svg class="google-icon" viewBox="0 0 48 48">
            <path fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3L37.4 9.5C34.1 6.5 29.3 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5s20.5-9.2 20.5-20.5c0-1.4-.1-2.7-.4-4z" />
            <path fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3L37.4 9.5C34.1 6.5 29.3 4.5 24 4.5c-7.7 0-14.4 4.4-18.1 10.2z" />
            <path fill="#4CAF50"
              d="M24 45.5c5.2 0 9.9-2 13.4-5.1l-6.2-5.2C29.4 37 26.8 38 24 38c-5.3 0-9.7-3.2-11.3-7.8l-6.5 5C9.7 41.1 16.4 45.5 24 45.5z" />
            <path fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4-4.1 5.3l6.2 5.2C41 35 43.5 30.5 43.5 25c0-1.5-.1-2.8-.4-4.5z" />
          </svg>
          Continue with Google
        </a>

        <div class="divider"><span>or sign up with email</span></div>

        <form id="signupForm" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" autocomplete="name" placeholder="Ali Khan" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" required />
            <div class="hint" id="pwHint">At least 8 characters, with letters and numbers</div>
          </div>
          <button type="submit" class="submit" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-text">Create account</span>
          </button>
        </form>

        <div class="foot">Already have an account? <a href="/login">Log in</a></div>
      </div>

      <!-- Step 2: OTP Verification -->
      <div id="otpStep">
        <h1>Check your email</h1>
        <p class="otp-info">We sent a 6-digit code to <strong id="otpEmail"></strong>.<br>Enter it below to verify your
          account.</p>

        <div class="banner error" id="otpErrBanner"></div>

        <div class="otp-inputs">
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d0" aria-label="Digit 1" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d1" aria-label="Digit 2" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d2" aria-label="Digit 3" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d3" aria-label="Digit 4" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d4" aria-label="Digit 5" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d5" aria-label="Digit 6" />
        </div>

        <button class="submit" id="verifyBtn" disabled>
          <span class="spinner"></span>
          <span class="btn-text">Verify email</span>
        </button>

        <div class="resend-row">
          Didn't get it? <button id="resendBtn" disabled>Resend code</button>
          <span id="countdown" style="color:var(--t3)"></span>
        </div>
      </div>

    </div>
  </div>

  <script src="/assets/ui.js?v=20261123"></script>
  <script src="/assets/session.js?v=20261123"></script>
  <script src="/assets/api.js?v=20261123"></script>
  <script src="/assets/password.js?v=20261123"></script>
  <script>
    let pendingEmail = '';
    let countdownInterval = null;

    leaveIfSignedIn();
    bindPasswordHint(document.getElementById('password'), document.getElementById('pwHint'));

    // Signup submit
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('errBanner').style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (name.length < 2) { showSignupError('Enter your name.'); return; }
      if (!email) { showSignupError('Enter your email.'); return; }
      const problem = passwordProblem(password);
      if (problem) { showSignupError(problem); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.classList.add('loading');

      try {
        await api('/auth/signup', { json: { name, email, password }, redirect: false, fallback: 'Could not create account. Please try again.' });
        showOtpStep(email);
        startResendCountdown(60);
      } catch (err) {
        showSignupError(err.message);
        btn.disabled = false; btn.classList.remove('loading');
      }
    });

    // OTP digit inputs — auto-advance
    const digits = ['d0', 'd1', 'd2', 'd3', 'd4', 'd5'];
    digits.forEach((id, i) => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        // Only allow digits
        el.value = el.value.replace(/[^0-9]/g, '');
        if (el.value && i < digits.length - 1) document.getElementById(digits[i + 1]).focus();
        checkOtpReady();
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !el.value && i > 0) {
          document.getElementById(digits[i - 1]).focus();
        }
      });
      // Handle paste
      el.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
        [...text.slice(0, 6)].forEach((ch, j) => {
          const t = document.getElementById(digits[j]);
          if (t) t.value = ch;
        });
        // Focus last filled or end
        const last = Math.min(text.length, 5);
        document.getElementById(digits[last])?.focus();
        checkOtpReady();
      });
    });

    let lastTriedOtp = '';
    function checkOtpReady() {
      const full = digits.every(id => document.getElementById(id).value.length === 1);
      const btn = document.getElementById('verifyBtn');
      btn.disabled = !full;
      // Submit as soon as the 6th digit lands; once per distinct code, so a wrong code doesn't loop
      if (full && getOtpValue() !== lastTriedOtp) { lastTriedOtp = getOtpValue(); btn.click(); }
    }

    function getOtpValue() {
      return digits.map(id => document.getElementById(id).value).join('');
    }

    // Verify button
    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const otp = getOtpValue();
      const btn = document.getElementById('verifyBtn');
      btn.disabled = true; btn.classList.add('loading');
      document.getElementById('otpErrBanner').style.display = 'none';

      try {
        await api('/auth/verify-email', { json: { email: pendingEmail, otp }, redirect: false, fallback: 'Invalid code. Please check and try again.' });
        const next = safeNext(new URLSearchParams(location.search).get('next'));
        window.location.href = `/splash.html?next=${encodeURIComponent(next)}`;
      } catch (err) {
        showOtpError(err.message);
        btn.classList.remove('loading');
        if (!err.status) { btn.disabled = false; return; } // nobody answered: keep what was typed
        digits.forEach(id => { document.getElementById(id).value = ''; });
        document.getElementById('d0').focus();
      }
    });

    // Resend OTP
    document.getElementById('resendBtn').addEventListener('click', async () => {
      document.getElementById('resendBtn').disabled = true;
      document.getElementById('otpErrBanner').style.display = 'none';

      try {
        await resendCode(pendingEmail);
        return startResendCountdown(60);
      } catch (err) {
        showOtpError(err.message);
      }
      document.getElementById('resendBtn').disabled = false;
    });

    function resendCode(email) {
      return api('/auth/resend-otp', { json: { email }, redirect: false, fallback: 'Could not send a code. Try again.' });
    }

    function startResendCountdown(seconds) {
      clearInterval(countdownInterval);
      const btn = document.getElementById('resendBtn');
      const cd = document.getElementById('countdown');
      btn.disabled = true;
      let remaining = seconds;
      cd.textContent = ` (${remaining}s)`;
      countdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          cd.textContent = '';
          btn.disabled = false;
        } else {
          cd.textContent = ` (${remaining}s)`;
        }
      }, 1000);
    }

    function showOtpStep(email) {
      pendingEmail = email;
      document.getElementById('signupStep').style.display = 'none';
      document.getElementById('otpStep').style.display = 'block';
      document.getElementById('otpEmail').textContent = email;
      document.getElementById('d0').focus();
    }

    // Sent here by login for an account that has not been verified yet
    (async () => {
      const email = new URLSearchParams(location.search).get('verify');
      if (!email) return;
      showOtpStep(email);
      try {
        await resendCode(email);
        startResendCountdown(60);
      } catch (err) {
        // 429: a code went out less than a minute ago and is still the valid one
        if (err.status === 429) return startResendCountdown(60);
        showOtpError(err.message);
        document.getElementById('resendBtn').disabled = false;
      }
    })();

    function showSignupError(msg) {
      const b = document.getElementById('errBanner');
      b.textContent = msg; b.style.display = 'flex';
    }
    function showOtpError(msg) {
      const b = document.getElementById('otpErrBanner');
      b.textContent = msg; b.style.display = 'flex';
    }
  </script>
</body>

</html>
