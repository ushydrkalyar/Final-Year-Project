<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — CutSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0F1117;
      --card: #1A1D29;
      --card2: #22263A;
      --card3: #2A2F45;
      --border: rgba(255, 255, 255, .07);
      --border2: rgba(255, 255, 255, .13);
      --primary: #6366F1;
      --primary-d: #4F46E5;
      --primary-g: rgba(99, 102, 241, .14);
      --success: #22C55E;
      --success-g: rgba(34, 197, 94, .12);
      --danger: #EF4444;
      --danger-g: rgba(239, 68, 68, .12);
      --t1: #FFFFFF;
      --t2: #94A3B8;
      --t3: #475569;
      --radius: 8px;
      --radius-lg: 12px;
      --tr: .16s cubic-bezier(.4, 0, .2, 1);
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      font-size: 15px
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, .10), transparent 45%)
    }

    button {
      font-family: var(--font);
      cursor: pointer;
      border: none
    }

    input {
      font-family: var(--font);
      outline: none
    }

    .topbar {
      width: 100%;
      max-width: 1180px;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 32px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.01em;
      text-decoration: none;
      color: var(--t1)
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      stroke: #fff;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round
    }

    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px
    }

    .card {
      width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 30px 80px -25px rgba(0, 0, 0, .55)
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin-bottom: 6px
    }

    .sub {
      font-size: 13px;
      color: var(--t2);
      margin-bottom: 26px
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--t2);
      margin-bottom: 6px;
      letter-spacing: .01em
    }

    .field {
      margin-bottom: 16px
    }

    input[type=email],
    input[type=password],
    input[type=text] {
      width: 100%;
      background: var(--card3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--t1);
      font-size: 13.5px;
      padding: 10px 12px;
      transition: var(--tr)
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-g)
    }

    input.err {
      border-color: var(--danger)
    }

    .hint {
      font-size: 11px;
      color: var(--t3);
      margin-top: 5px
    }

    .hint.bad {
      color: #FCA5A5
    }

    .hint.good {
      color: var(--success)
    }

    .submit {
      width: 100%;
      padding: 11px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      transition: var(--tr);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .submit:hover:not(:disabled) {
      background: var(--primary-d);
      box-shadow: 0 0 20px rgba(99, 102, 241, .3)
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none
    }

    .submit.loading .spinner {
      display: inline-block
    }

    .submit.loading .btn-text {
      display: none
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .banner {
      font-size: 12.5px;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px
    }

    .banner.error {
      background: var(--danger-g);
      color: #FCA5A5;
      display: flex
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border2)
    }

    .divider span {
      font-size: 11.5px;
      color: var(--t3);
      white-space: nowrap
    }

    /* Google button */
    .google-btn {
      width: 100%;
      padding: 10px;
      border-radius: var(--radius);
      background: var(--card2);
      color: var(--t1);
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--tr);
      cursor: pointer;
      text-decoration: none
    }

    .google-btn:hover {
      background: var(--card3);
      border-color: rgba(255, 255, 255, .22)
    }

    .google-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0
    }

    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 12.5px;
      color: var(--t2)
    }

    .foot a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600
    }

    .foot a:hover {
      text-decoration: underline
    }

    /* OTP step */
    #otpStep {
      display: none
    }

    .otp-info {
      font-size: 13px;
      color: var(--t2);
      margin-bottom: 20px;
      line-height: 1.6
    }

    .otp-info strong {
      color: var(--t1)
    }

    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px
    }

    .otp-inputs input {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      font-family: var(--mono);
      background: var(--card3);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--t1);
      caret-color: var(--primary)
    }

    .otp-inputs input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-g)
    }

    .resend-row {
      text-align: center;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--t2)
    }

    .resend-row button {
      background: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 12.5px;
      padding: 0;
      border: none;
      cursor: pointer
    }

    .resend-row button:disabled {
      color: var(--t3);
      cursor: not-allowed
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="logo" href="/welcome.html">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="9.5" width="3" height="5" rx="1.5" fill="white" />
          <rect x="7" y="5.5" width="3" height="13" rx="1.5" fill="white" />
          <rect x="14" y="5.5" width="3" height="13" rx="1.5" fill="white" />
          <rect x="19" y="9.5" width="3" height="5" rx="1.5" fill="white" />
          <line x1="12" y1="6" x2="12" y2="18" stroke="white" stroke-width="1.5" stroke-linecap="round"
            stroke-dasharray="1.5 2.3" opacity=".85" />
        </svg></div>
      CutSmart
    </a>
  </header>

  <div class="wrap">
    <div class="card">

      <!-- Step 1: Signup form -->
      <div id="signupStep">
        <h1>Create your account</h1>
        <p class="sub">Free to start — no credit card needed.</p>

        <div class="banner error" id="errBanner"></div>

        <!-- Google Sign-Up -->
        <a class="google-btn" href="/auth/google">
          <svg class="google-icon" viewBox="0 0 48 48">
            <path fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3L37.4 9.5C34.1 6.5 29.3 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5s20.5-9.2 20.5-20.5c0-1.4-.1-2.7-.4-4z" />
            <path fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3L37.4 9.5C34.1 6.5 29.3 4.5 24 4.5c-7.7 0-14.4 4.4-18.1 10.2z" />
            <path fill="#4CAF50"
              d="M24 45.5c5.2 0 9.9-2 13.4-5.1l-6.2-5.2C29.4 37 26.8 38 24 38c-5.3 0-9.7-3.2-11.3-7.8l-6.5 5C9.7 41.1 16.4 45.5 24 45.5z" />
            <path fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4-4.1 5.3l6.2 5.2C41 35 43.5 30.5 43.5 25c0-1.5-.1-2.8-.4-4.5z" />
          </svg>
          Continue with Google
        </a>

        <div class="divider"><span>or sign up with email</span></div>

        <form id="signupForm" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" autocomplete="name" placeholder="Ali Khan" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" required />
            <div class="hint" id="pwHint">At least 8 characters, with letters and numbers</div>
          </div>
          <button type="submit" class="submit" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-text">Create account</span>
          </button>
        </form>

        <div class="foot">Already have an account? <a href="/login">Log in</a></div>
      </div>

      <!-- Step 2: OTP Verification -->
      <div id="otpStep">
        <h1>Check your email</h1>
        <p class="otp-info">We sent a 6-digit code to <strong id="otpEmail"></strong>.<br>Enter it below to verify your
          account.</p>

        <div class="banner error" id="otpErrBanner"></div>

        <div class="otp-inputs">
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d0" aria-label="Digit 1" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d1" aria-label="Digit 2" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d2" aria-label="Digit 3" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d3" aria-label="Digit 4" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d4" aria-label="Digit 5" />
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d5" aria-label="Digit 6" />
        </div>

        <button class="submit" id="verifyBtn" disabled>
          <span class="spinner"></span>
          <span class="btn-text">Verify email</span>
        </button>

        <div class="resend-row">
          Didn't get it? <button id="resendBtn" disabled>Resend code</button>
          <span id="countdown" style="color:var(--t3)"></span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API = window.location.origin;
    let pendingEmail = '';
    let countdownInterval = null;

    // Redirect if already logged in
    (async () => {
      try {
        const r = await fetch(`${API}/auth/me`, { credentials: 'include' });
        if (r.ok) window.location.href = '/editor.html';
      } catch (_) { }
    })();

    // Live password strength hint
    const pwInput = document.getElementById('password');
    const pwHint = document.getElementById('pwHint');
    pwInput.addEventListener('input', () => {
      const v = pwInput.value;
      const ok = v.length >= 8 && /[A-Za-z]/.test(v) && /[0-9]/.test(v);
      if (!v) { pwHint.textContent = 'At least 8 characters, with letters and numbers'; pwHint.className = 'hint'; }
      else if (ok) { pwHint.textContent = 'Looks good'; pwHint.className = 'hint good'; }
      else { pwHint.textContent = 'At least 8 characters, with letters and numbers'; pwHint.className = 'hint bad'; }
    });

    // Signup submit
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('errBanner').style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (name.length < 2) { showSignupError('Enter your name.'); return; }
      if (!email) { showSignupError('Enter your email.'); return; }
      if (password.length < 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
        showSignupError('Password must be at least 8 characters and include letters and numbers.'); return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.classList.add('loading');

      try {
        const r = await fetch(`${API}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, email, password }),
        });
        const data = await r.json();

        if (!r.ok) {
          const msg = Array.isArray(data.detail)
            ? data.detail.map(d => d.msg).join(' ')
            : (data.detail || 'Could not create account. Please try again.');
          showSignupError(msg);
          btn.disabled = false; btn.classList.remove('loading');
          return;
        }

        // Show OTP step
        pendingEmail = email;
        document.getElementById('signupStep').style.display = 'none';
        document.getElementById('otpStep').style.display = 'block';
        document.getElementById('otpEmail').textContent = email;
        document.getElementById('d0').focus();
        startResendCountdown(60);

      } catch {
        showSignupError('Could not reach the server. Is it running?');
        btn.disabled = false; btn.classList.remove('loading');
      }
    });

    // OTP digit inputs — auto-advance
    const digits = ['d0', 'd1', 'd2', 'd3', 'd4', 'd5'];
    digits.forEach((id, i) => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        // Only allow digits
        el.value = el.value.replace(/[^0-9]/g, '');
        if (el.value && i < digits.length - 1) document.getElementById(digits[i + 1]).focus();
        checkOtpReady();
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !el.value && i > 0) {
          document.getElementById(digits[i - 1]).focus();
        }
      });
      // Handle paste
      el.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
        [...text.slice(0, 6)].forEach((ch, j) => {
          const t = document.getElementById(digits[j]);
          if (t) t.value = ch;
        });
        // Focus last filled or end
        const last = Math.min(text.length, 5);
        document.getElementById(digits[last])?.focus();
        checkOtpReady();
      });
    });

    function checkOtpReady() {
      const full = digits.every(id => document.getElementById(id).value.length === 1);
      document.getElementById('verifyBtn').disabled = !full;
    }

    function getOtpValue() {
      return digits.map(id => document.getElementById(id).value).join('');
    }

    // Verify button
    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const otp = getOtpValue();
      const btn = document.getElementById('verifyBtn');
      btn.disabled = true; btn.classList.add('loading');
      document.getElementById('otpErrBanner').style.display = 'none';

      try {
        const r = await fetch(`${API}/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: pendingEmail, otp }),
        });
        const data = await r.json();

        if (!r.ok) {
          showOtpError(data.detail || 'Invalid code. Please check and try again.');
          // Shake & clear inputs
          digits.forEach(id => { document.getElementById(id).value = ''; });
          document.getElementById('d0').focus();
          btn.disabled = true; btn.classList.remove('loading');
          return;
        }

        window.location.href = '/splash.html?next=/editor.html';

      } catch {
        showOtpError('Could not reach the server.');
        btn.disabled = false; btn.classList.remove('loading');
      }
    });

    // Resend OTP
    document.getElementById('resendBtn').addEventListener('click', async () => {
      document.getElementById('resendBtn').disabled = true;
      document.getElementById('otpErrBanner').style.display = 'none';

      try {
        await fetch(`${API}/auth/resend-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail }),
        });
        startResendCountdown(60);
      } catch {
        showOtpError('Could not resend code. Try again.');
      }
    });

    function startResendCountdown(seconds) {
      clearInterval(countdownInterval);
      const btn = document.getElementById('resendBtn');
      const cd = document.getElementById('countdown');
      btn.disabled = true;
      let remaining = seconds;
      cd.textContent = ` (${remaining}s)`;
      countdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          cd.textContent = '';
          btn.disabled = false;
        } else {
          cd.textContent = ` (${remaining}s)`;
        }
      }, 1000);
    }

    function showSignupError(msg) {
      const b = document.getElementById('errBanner');
      b.textContent = msg; b.style.display = 'flex';
    }
    function showOtpError(msg) {
      const b = document.getElementById('otpErrBanner');
      b.textContent = msg; b.style.display = 'flex';
    }
  </script>
</body>

</html>
