<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — CutSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/auth.css?v=20261123" />
  <style>
    body {
      background-image: radial-gradient(circle at 50% 0%, rgba(116, 245, 184, .10), transparent 45%);
    }
    .logo {
      letter-spacing: -.01em;
    }
    .logo-icon svg {
      width: 16px;
      height: 16px;
      stroke: #fff;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
    }
    .card {
      width: 380px;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .label-row label {
      margin-bottom: 0;
    }
    .label-row a {
      font-size: 11px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .label-row a:hover {
      text-decoration: underline;
    }
    input.err {
      border-color: var(--danger);
    }
  </style>
  <link rel="stylesheet" href="/assets/theme.css?v=20261123" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="topbar">
    <a class="logo" href="/welcome.html">
      <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="9.5" width="3" height="5" rx="1.5" fill="#0A0A0B" />
          <rect x="7" y="5.5" width="3" height="13" rx="1.5" fill="#0A0A0B" />
          <rect x="14" y="5.5" width="3" height="13" rx="1.5" fill="#0A0A0B" />
          <rect x="19" y="9.5" width="3" height="5" rx="1.5" fill="#0A0A0B" />
          <line x1="12" y1="6" x2="12" y2="18" stroke="#0A0A0B" stroke-width="1.5" stroke-linecap="round"
            stroke-dasharray="1.5 2.3" opacity=".85" />
        </svg></div>
      CutSmart
    </a>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to pick up where you left off.</p>

      <div class="banner error" id="errBanner"></div>

      <!-- Google Sign-In -->
      <a class="google-btn" href="/auth/google" id="googleBtn">
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3L37.4 9.5C34.1 6.5 29.3 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5s20.5-9.2 20.5-20.5c0-1.4-.1-2.7-.4-4z" />
          <path fill="#FF3D00"
            d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3L37.4 9.5C34.1 6.5 29.3 4.5 24 4.5c-7.7 0-14.4 4.4-18.1 10.2z" />
          <path fill="#4CAF50"
            d="M24 45.5c5.2 0 9.9-2 13.4-5.1l-6.2-5.2C29.4 37 26.8 38 24 38c-5.3 0-9.7-3.2-11.3-7.8l-6.5 5C9.7 41.1 16.4 45.5 24 45.5z" />
          <path fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4-4.1 5.3l6.2 5.2C41 35 43.5 30.5 43.5 25c0-1.5-.1-2.8-.4-4.5z" />
        </svg>
        Continue with Google
      </a>

      <div class="divider"><span>or sign in with email</span></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="/forgot-password">Forgot password?</a>
          </div>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit" id="submitBtn">
          <span class="spinner"></span>
          <span class="btn-text">Log in</span>
        </button>
      </form>

      <div class="foot">Don't have an account? <a href="/signup">Sign up free</a></div>
    </div>
  </div>

  <script src="/assets/ui.js?v=20261123"></script>
  <script src="/assets/session.js?v=20261123"></script>
  <script src="/assets/api.js?v=20261123"></script>
  <script>

    leaveIfSignedIn(_nextUrl());

    // Surface a friendly message if the Google sign-in redirect sent us
    // back here with a problem, instead of leaving the user stranded on
    // Google's own raw error page.
    (() => {
      const err = new URLSearchParams(window.location.search).get('google_error');
      if (!err) return;
      const messages = {
        not_configured: 'Google sign-in isn\'t set up yet on this server — please continue with email below.',
        failed: 'Google sign-in didn\'t go through. Please try again, or continue with email below.',
      };
      showError(messages[err] || 'Google sign-in ran into a problem. Please continue with email below.');
      const gbtn = document.getElementById('googleBtn');
      if (err === 'not_configured' && gbtn) {
        gbtn.style.opacity = '.5';
        gbtn.style.pointerEvents = 'none';
        gbtn.title = 'Google sign-in is not configured yet';
      }
      // Clean the URL so refreshing/sharing it doesn't repeat the banner.
      window.history.replaceState({}, '', window.location.pathname);
    })();

    function _nextUrl() {
      return safeNext(new URLSearchParams(window.location.search).get('next'));
    }

    function showError(msg) {
      const b = document.getElementById('errBanner');
      b.textContent = msg; b.style.display = 'flex';
    }
    function hideError() {
      document.getElementById('errBanner').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showError('Enter your email and password.'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.classList.add('loading');

      try {
        await api('/auth/login', { json: { email, password }, redirect: false, fallback: 'Could not log in. Please try again.' });
        window.location.href = `/splash?next=${encodeURIComponent(_nextUrl())}`;
      } catch (err) {
        if (err.status === 403) { // not verified yet: the code entry lives on the signup page
          window.location.href = `/signup.html?verify=${encodeURIComponent(email)}&next=${encodeURIComponent(_nextUrl())}`;
          return;
        }
        showError(err.message);
        btn.disabled = false; btn.classList.remove('loading');
      }
    });
  </script>
</body>

</html>
