<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CutSmart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1117;--card:#1A1D29;
  --primary:#6366F1;--primary-d:#4F46E5;
  --t1:#FFFFFF;--t2:#94A3B8;--t3:#475569;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:var(--font);background:var(--bg);color:var(--t1);
  height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  background-image:radial-gradient(circle at 50% 45%, rgba(99,102,241,.14), transparent 55%);
}

.stage{display:flex;flex-direction:column;align-items:center;gap:22px;
  opacity:0;transform:scale(.9);transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1)}
.stage.in{opacity:1;transform:scale(1)}
.stage.out{opacity:0;transform:scale(1.04);transition:opacity .5s ease,transform .5s ease}

.badge{width:72px;height:72px;border-radius:20px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px -12px rgba(99,102,241,.55)}
.badge svg{width:40px;height:40px}
.bar{transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
.bar1{animation-delay:0s}.bar2{animation-delay:.12s}.bar3{animation-delay:.24s}.bar4{animation-delay:.36s}
@keyframes pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}

.wordmark{font-size:26px;font-weight:800;letter-spacing:-.01em}
.tagline{font-size:12.5px;color:var(--t2);margin-top:-14px;font-family:var(--mono);letter-spacing:.02em}

.loader{width:140px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.loader-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#818CF8);border-radius:2px;
  transition:width 1.9s cubic-bezier(.4,0,.2,1)}
.loader-fill.go{width:100%}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none">
      <rect class="bar bar1" x="2"  y="9.5" width="3" height="5"  rx="1.5" fill="white"/>
      <rect class="bar bar2" x="7"  y="5.5" width="3" height="13" rx="1.5" fill="white"/>
      <rect class="bar bar3" x="14" y="5.5" width="3" height="13" rx="1.5" fill="white"/>
      <rect class="bar bar4" x="19" y="9.5" width="3" height="5"  rx="1.5" fill="white"/>
      <line x1="12" y1="6" x2="12" y2="18" stroke="white" stroke-width="1.5"
            stroke-linecap="round" stroke-dasharray="1.5 2.3" opacity=".85"/>
    </svg>
  </div>
  <div class="wordmark">CutSmart</div>
  <div class="tagline" id="taglineText">Setting up your workspace…</div>
  <div class="loader"><div class="loader-fill" id="loaderFill"></div></div>
</div>

<script>
// Reads ?next= to know where to blend into once the splash finishes.
// Falls back to the editor if this page is ever opened without a target.
function nextUrl() {
  const params = new URLSearchParams(window.location.search);
  const n = params.get('next');
  return n && n.startsWith('/') ? n : '/editor.html';
}

const stage  = document.getElementById('stage');
const fill   = document.getElementById('loaderFill');
const target = nextUrl();

requestAnimationFrame(() => {
  stage.classList.add('in');
  requestAnimationFrame(() => fill.classList.add('go'));
});

// Total on-screen time before blending into the app — long enough to read,
// short enough not to feel like a wait.
const HOLD_MS = 1650;
const FADE_MS = 480;

setTimeout(() => {
  stage.classList.remove('in');
  stage.classList.add('out');
}, HOLD_MS);

setTimeout(() => {
  // Same --bg colour as every other page, so this read as a dissolve
  // into the next page rather than a hard cut.
  window.location.replace(target);
}, HOLD_MS + FADE_MS);
</script>
</body>
</html>
